<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生成绩分析系统</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/animations.css">
</head>
<body>
    <div class="app-container">
        <!-- 头部标题栏 -->
        <header class="app-header">
            <div class="header-content">
                <h1 class="app-title">学生成绩分析系统</h1>
                <div class="header-actions">
                    <div class="status-indicator" id="statusIndicator">
                        <span class="status-dot"></span>
                        <span class="status-text">等待文件选择</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- 主要内容区域 -->
        <main class="app-main">
            <!-- 左侧控制面板 -->
            <aside class="control-panel">
                <!-- 文件选择区域 -->
                <section class="file-section">
                    <h2 class="section-title">文件选择</h2>
                    <div class="file-input-group">
                        <label class="file-label">成绩文件</label>
                        <div class="file-input-wrapper">
                            <input type="text" class="file-input" id="scoreFile" placeholder="选择成绩Excel文件" readonly>
                            <button class="file-browse-btn" data-target="scoreFile">
                                <span class="btn-icon">📁</span>
                                浏览
                            </button>
                        </div>
                    </div>
                    <div class="file-input-group">
                        <label class="file-label">权重文件</label>
                        <div class="file-input-wrapper">
                            <input type="text" class="file-input" id="weightFile" placeholder="选择权重Excel文件" readonly>
                            <button class="file-browse-btn" data-target="weightFile">
                                <span class="btn-icon">📁</span>
                                浏览
                            </button>
                        </div>
                    </div>
                </section>

                <!-- 数据分析区域 -->
                <section class="analysis-section">
                    <h2 class="section-title">数据分析</h2>
                    <div class="action-buttons">
                        <button class="primary-btn" id="processBtn">
                            <span class="btn-icon">⚡</span>
                            处理数据
                        </button>
                        <button class="secondary-btn" id="exportBtn" disabled>
                            <span class="btn-icon">📊</span>
                            导出结果
                        </button>
                        <button class="danger-btn" id="clearBtn">
                            <span class="btn-icon">🗑️</span>
                            清空结果
                        </button>
                    </div>
                </section>

                <!-- 进度指示器 -->
                <section class="progress-section" id="progressSection" style="display: none;">
                    <h3 class="section-title">处理进度</h3>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="progress-text" id="progressText">0%</div>
                </section>
            </aside>

            <!-- 右侧结果显示区域 -->
            <section class="results-panel">
                <div class="results-header">
                    <h2 class="results-title">分析结果</h2>
                    <div class="results-tabs">
                        <button class="tab-btn active" data-tab="ranking">成绩排名</button>
                        <button class="tab-btn" data-tab="achievement">目标达成度</button>
                        <button class="tab-btn" data-tab="statistics">统计分析</button>
                        <button class="tab-btn" data-tab="distribution">等级分布</button>
                    </div>
                </div>

                <div class="results-content">
                    <!-- 成绩排名表 -->
                    <div class="tab-content active" id="ranking">
                        <div class="table-container">
                            <table class="data-table" id="rankingTable">
                                <thead>
                                    <tr>
                                        <th>排名</th>
                                        <th>学号</th>
                                        <th>姓名</th>
                                        <th>考勤</th>
                                        <th>平时作业</th>
                                        <th>期末考试</th>
                                        <th>总成绩</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr class="empty-state">
                                        <td colspan="7">暂无数据，请先处理数据</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- 目标达成度表 -->
                    <div class="tab-content" id="achievement">
                        <div class="table-container">
                            <table class="data-table" id="achievementTable">
                                <thead>
                                    <tr>
                                        <th>学号</th>
                                        <th>姓名</th>
                                        <th>目标1达成度</th>
                                        <th>目标2达成度</th>
                                        <th>目标3达成度</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr class="empty-state">
                                        <td colspan="5">暂无数据，请先处理数据</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- 统计分析 -->
                    <div class="tab-content" id="statistics">
                        <div class="stats-grid">
                            <div class="stat-card">
                                <h3>目标1统计</h3>
                                <div class="stat-value" id="target1Stats">--</div>
                                <div class="stat-label">平均达成率</div>
                            </div>
                            <div class="stat-card">
                                <h3>目标2统计</h3>
                                <div class="stat-value" id="target2Stats">--</div>
                                <div class="stat-label">平均达成率</div>
                            </div>
                            <div class="stat-card">
                                <h3>目标3统计</h3>
                                <div class="stat-value" id="target3Stats">--</div>
                                <div class="stat-label">平均达成率</div>
                            </div>
                        </div>
                        <div class="table-container">
                            <table class="data-table" id="statisticsTable">
                                <thead>
                                    <tr>
                                        <th>目标</th>
                                        <th>权重占比(%)</th>
                                        <th>平均分数</th>
                                        <th>达成率(%)</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr class="empty-state">
                                        <td colspan="4">暂无数据，请先处理数据</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- 等级分布 -->
                    <div class="tab-content" id="distribution">
                        <div class="distribution-chart" id="gradeChart">
                            <div class="chart-placeholder">
                                <span>📊</span>
                                <p>暂无数据，请先处理数据</p>
                            </div>
                        </div>
                        <div class="table-container">
                            <table class="data-table" id="distributionTable">
                                <thead>
                                    <tr>
                                        <th>等级</th>
                                        <th>人数</th>
                                        <th>比例</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr class="empty-state">
                                        <td colspan="3">暂无数据，请先处理数据</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- 加载脚本 -->
    <script src="scripts/app.js"></script>
    <script src="scripts/matlab-bridge.js"></script>
    
    <!-- MATLAB通信脚本 -->
    <script type="text/javascript">
        // 确保DOM加载完成后再初始化
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded, waiting for setup...');
            
            // 如果MATLAB还没调用setup，先初始化基本功能
            setTimeout(function() {
                if (!window.gradeAnalysisApp && typeof StudentGradeAnalysisApp !== 'undefined') {
                    console.log('Auto-initializing StudentGradeAnalysisApp...');
                    window.gradeAnalysisApp = new StudentGradeAnalysisApp();
                    
                    // 创建临时matlabProxy用于测试
                    if (!window.matlabProxy) {
                        window.matlabProxy = {
                            selectFile: function(type) {
                                console.log('MATLAB未连接，使用模拟模式选择文件:', type);
                                window.gradeAnalysisApp.simulateFileSelection(type);
                            },
                            processData: function(scoreFile, weightFile) {
                                console.log('MATLAB未连接，使用模拟模式处理数据');
                                window.gradeAnalysisApp.simulateDataProcessing();
                            },
                            exportResults: function(resultData) {
                                console.log('MATLAB未连接，模拟导出结果');
                                window.gradeAnalysisApp.showSuccess('结果导出完成（模拟模式）');
                            }
                        };
                    }
                }
            }, 1000);
        });

        // 调试处理函数
        window.handleDebugCommands = function(data) {
            console.log('处理调试命令:', data.action);
            
            switch(data.action) {
                case 'debug_inject':
                    eval(data.jsCode);
                    break;
                
                case 'force_file_select':
                    console.log('强制文件选择:', data.type);
                    if (window.matlabProxy) {
                        window.matlabProxy.selectFile(data.type);
                    } else {
                        console.log('matlabProxy不存在，创建模拟版本');
                        alert('强制文件选择被触发: ' + data.type);
                    }
                    break;
                
                case 'create_test_button':
                    const testBtn = document.createElement('button');
                    testBtn.textContent = '测试按钮';
                    testBtn.style.cssText = 'position:fixed;top:10px;right:10px;z-index:9999;background:red;color:white;padding:10px;';
                    testBtn.onclick = function() {
                        alert('测试按钮被点击！');
                        if (window.matlabProxy) {
                            window.matlabProxy.selectFile('scoreFile');
                        }
                    };
                    document.body.appendChild(testBtn);
                    console.log('测试按钮已创建');
                    break;
                
                case 'eval_js':
                    eval(data.code);
                    break;
                
                case 'simulate_click':
                    console.log('模拟按钮点击');
                    const btn = document.querySelector(`[data-target="${data.target}"]`);
                    if (btn) {
                        btn.click();
                        console.log('按钮点击事件已触发');
                    } else {
                        console.log('未找到目标按钮');
                    }
                    break;
                
                case 'check_status':
                    console.log('=== 前端状态检查 ===');
                    console.log('matlabProxy:', window.matlabProxy);
                    console.log('gradeAnalysisApp:', window.gradeAnalysisApp);
                    console.log('htmlComponent:', window.htmlComponent);
                    console.log('按钮数量:', document.querySelectorAll('.file-browse-btn').length);
                    console.log('事件监听器状态: 检查绑定');
                    break;
                
                case 'ping':
                    console.log('收到Ping:', data.timestamp);
                    // 发送Pong回复
                    if (window.htmlComponent) {
                        const response = {action: 'pong', timestamp: new Date().toISOString()};
                        window.htmlComponent.Data = JSON.stringify(response);
                    }
                    break;
            }
        };

        // 修改原有的setup函数，添加调试命令处理
        function setup(htmlComponent) {
            console.log('MATLAB setup function called');
            
            // 确保应用已初始化
            if (!window.gradeAnalysisApp) {
                if (typeof StudentGradeAnalysisApp !== 'undefined') {
                    window.gradeAnalysisApp = new StudentGradeAnalysisApp();
                    console.log('StudentGradeAnalysisApp initialized in setup');
                } else {
                    console.error('Cannot initialize: StudentGradeAnalysisApp class not found');
                    return;
                }
            }
            
            window.htmlComponent = htmlComponent;
            
            // 监听来自MATLAB的数据变化
            htmlComponent.addEventListener("DataChanged", function(event) {
                try {
                    if (!htmlComponent.Data) return;
                    
                    const data = JSON.parse(htmlComponent.Data);
                    console.log('Received data from MATLAB:', data);
                    
                    // 首先检查是否是调试命令
                    if (data.action && (data.action.startsWith('debug_') || 
                                      data.action === 'force_file_select' || 
                                      data.action === 'create_test_button' ||
                                      data.action === 'eval_js' ||
                                      data.action === 'simulate_click' ||
                                      data.action === 'check_status' ||
                                      data.action === 'ping')) {
                        window.handleDebugCommands(data);
                        return;
                    }
                    
                    switch(data.action) {
                        case 'init':
                            // 设置默认文件路径
                            if (data.scoreFile) {
                                document.getElementById('scoreFile').value = data.scoreFile;
                            }
                            if (data.weightFile) {
                                document.getElementById('weightFile').value = data.weightFile;
                            }
                            window.gradeAnalysisApp.validateInputs();
                            break;
                            
                        case 'setFilePath':
                            // 设置文件路径
                            document.getElementById(data.fileType).value = data.filePath;
                            window.gradeAnalysisApp.updateStatus('info', `已选择${data.fileTypeName}文件`);
                            window.gradeAnalysisApp.validateInputs();
                            break;
                            
                        case 'updateStatus':
                            window.gradeAnalysisApp.updateStatus(data.type, data.message);
                            break;
                            
                        case 'updateProgress':
                            window.gradeAnalysisApp.updateProgress(data.percentage);
                            break;
                            
                        case 'updateTables':
                            window.gradeAnalysisApp.updateTables(data.data);
                            break;
                            
                        case 'enableExport':
                            document.getElementById('exportBtn').disabled = !data.enabled;
                            break;
                            
                        case 'showError':
                            window.gradeAnalysisApp.showError(data.message);
                            break;
                            
                        case 'showSuccess':
                            window.gradeAnalysisApp.showSuccess(data.message);
                            break;
                    }
                } catch (error) {
                    console.error('Error processing MATLAB data:', error);
                }
            });
            
            // 创建MATLAB代理对象用于发送数据到MATLAB
            window.matlabProxy = {
                selectFile: function(type) {
                    console.log('Calling MATLAB selectFile with type:', type);
                    const data = {
                        action: 'selectFile',
                        type: type
                    };
                    htmlComponent.Data = JSON.stringify(data);
                },
                
                processData: function(scoreFile, weightFile) {
                    console.log('Calling MATLAB processData with files:', scoreFile, weightFile);
                    const data = {
                        action: 'processData',
                        scoreFile: scoreFile,
                        weightFile: weightFile
                    };
                    htmlComponent.Data = JSON.stringify(data);
                },
                
                exportResults: function(resultData) {
                    console.log('Calling MATLAB exportResults');
                    const data = {
                        action: 'exportResults',  
                        data: resultData || window.gradeAnalysisApp.data.processed
                    };
                    htmlComponent.Data = JSON.stringify(data);
                }
            };
            
            console.log('MATLAB setup complete, matlabProxy created');
        }
    </script>

    <!-- 在</body>前添加调试脚本 -->
    <script type="text/javascript">
    // 添加调试信息
    window.debugInfo = {
        matlabProxyExists: false,
        setupCalled: false,
        buttonClicks: 0
    };

    // 监听按钮点击事件
    document.addEventListener('click', function(e) {
        if (e.target.classList.contains('file-browse-btn')) {
            window.debugInfo.buttonClicks++;
            console.log('按钮点击次数:', window.debugInfo.buttonClicks);
            console.log('目标按钮:', e.target.dataset.target);
            console.log('matlabProxy是否存在:', !!window.matlabProxy);
            
            if (window.matlabProxy) {
                console.log('matlabProxy方法:', Object.keys(window.matlabProxy));
            }
        }
    });

    // 定期检查状态
    setInterval(function() {
        console.log('Debug Info:', {
            matlabProxy: !!window.matlabProxy,
            gradeAnalysisApp: !!window.gradeAnalysisApp,
            htmlComponent: !!window.htmlComponent
        });
    }, 5000);
    </script>
</body>
</html>
